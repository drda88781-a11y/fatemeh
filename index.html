<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FATEMEH — A Little Program for You ❤️</title>
  
  <meta name="description" content="یک تجربه عاشقانه و سینمایی تعاملی برای فاطمه">
  <meta name="theme-color" content="#05020a">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* Inline Fallback styles to ensure instantaneous render */
    body {
      background-color: #05020a;
      color: #ffffff;
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Audio Element (Siah Sefid by Haamim / Alireza Riazi) -->
  <audio id="bg-music" src="assets/music.mp3" preload="auto" loop></audio>

  <!-- Scene Container -->
  <div class="scene-container">

    <!-- Cosmic Background Layers -->
    <div class="cosmic-bg"></div>
    <div class="fog-layer"></div>

    <!-- 60FPS Particles Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Floating Audio Control Button -->
    <button id="audio-toggle-btn" class="audio-control-btn" aria-label="پخش یا توقف موسیقی">
      <span class="audio-icon-bars">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="audio-label">موسیقی</span>
    </button>

    <!-- ==========================================
         STAGE 1: Opening Screen
         ========================================== -->
    <section id="opening-screen" class="opening-screen">
      <div class="opening-icon-wrapper">
        <div class="pulsing-ring"></div>
        <svg class="opening-heart-icon" viewBox="0 0 24 24">
          <defs>
            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff70a6" />
              <stop offset="100%" stop-color="#ff2a85" />
            </linearGradient>
          </defs>
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
      </div>

      <h1 class="opening-title">یه برنامه کوچیک برای تو</h1>
      <p class="opening-subtitle">بعضی خروجی‌ها رو نمیشه از قبل حدس زد...</p>

      <button id="start-btn" class="start-btn">
        <span>اجرای برنامه</span>
      </button>
    </section>

    <!-- ==========================================
         STAGE 2: Realistic Programming Terminal (IDE)
         ========================================== -->
    <section id="terminal-window" class="terminal-window" aria-live="polite">
      <!-- Window Titlebar -->
      <div class="terminal-header">
        <div class="window-controls">
          <span class="window-control-dot dot-red"></span>
          <span class="window-control-dot dot-yellow"></span>
          <span class="window-control-dot dot-green"></span>
        </div>

        <div class="file-tab">
          <svg class="py-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z" opacity="0.3"/>
            <path d="M11.9 2c-3.8 0-6.1 1.6-6.1 3.8v1.9h6.1v.6H3.6C2.2 8.3 1 9.9 1 11.8s1.2 3.5 2.6 3.5h1.9v-2.6c0-1.9 1.6-3.5 3.5-3.5h6.1c1.6 0 2.9-1.3 2.9-2.9V5.8c0-2.2-2.3-3.8-6.1-3.8zm-2.2 1.6c.6 0 1 .4 1 1s-.4 1-1 1-1-.4-1-1 .4-1 1-1zm2.4 18.4c3.8 0 6.1-1.6 6.1-3.8v-1.9h-6.1v-.6h8.3c1.4 0 2.6-1.6 2.6-3.5s-1.2-3.5-2.6-3.5h-1.9v2.6c0 1.9-1.6 3.5-3.5 3.5h-6.1c-1.6 0-2.9 1.3-2.9 2.9v3.5c0 2.2 2.3 3.8 6.1 3.8zm2.2-1.6c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1z"/>
          </svg>
          <span>for_fatemeh.py</span>
        </div>

        <div class="terminal-status-badge">
          <span id="status-indicator" class="status-indicator-dot"></span>
          <span id="status-text">در حال تایپ...</span>
        </div>
      </div>

      <!-- Editor Code Body -->
      <div class="terminal-body">
        <div id="line-numbers" class="line-numbers"></div>
        <div id="code-content" class="code-editor-content"></div>
      </div>

      <!-- Fast Forward / Skip Button -->
      <button id="skip-btn" class="terminal-skip-btn">سرعت بالا ⚡</button>

      <!-- Terminal Output Console Drawer -->
      <div class="terminal-console">
        <div id="console-msg-1" class="console-msg success">
          <span class="console-badge">EXEC</span>
          <span>کدها با موفقیت اجرا شدند...</span>
        </div>
        <div id="console-msg-2" class="console-msg">
          <span class="console-badge">PROCESS</span>
          <span>در حال آماده‌سازی خروجی...</span>
        </div>
        <div id="console-msg-3" class="console-msg final">
          <span class="console-badge">RESULT</span>
          <span>خروجی با موفقیت ساخته شد ♥</span>
        </div>
      </div>
    </section>

    <!-- ==========================================
         STAGE 3 & 4: Cinematic Climax (Heart & Calligraphy)
         ========================================== -->
    <main id="climax-container" class="climax-container" aria-label="جلوه عاشقانه نهایی">
      
      <!-- Central Ambient Bloom -->
      <div class="ambient-glow-bloom"></div>

      <!-- Orbital Planetary Glow Rings -->
      <div class="orbital-ring orbital-ring-1">
        <div class="comet-sparkle"></div>
      </div>
      <div class="orbital-ring orbital-ring-2"></div>

      <!-- Pulsing Heart Stage -->
      <div class="heart-stage">
        
        <!-- Large Glowing SVG Heart -->
        <svg class="heart-svg" viewBox="0 0 600 560" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- Neon Pink-Magenta Stroke Gradient -->
            <linearGradient id="heartNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffa6ce" />
              <stop offset="35%" stop-color="#ff2a85" />
              <stop offset="75%" stop-color="#e024c3" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>

            <!-- Heart Inner Radial Light Fill -->
            <radialGradient id="heartInnerRadial" cx="50%" cy="45%" r="65%">
              <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.38" />
              <stop offset="55%" stop-color="#801168" stop-opacity="0.14" />
              <stop offset="100%" stop-color="#05020a" stop-opacity="0" />
            </radialGradient>

            <!-- Name Calligraphy Gradient -->
            <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="25%" stop-color="#ffeef6" />
              <stop offset="60%" stop-color="#ff60a8" />
              <stop offset="100%" stop-color="#ff1f7d" />
            </linearGradient>

            <!-- Soft Heart Filter -->
            <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="8" result="blur1" />
              <feGaussianBlur stdDeviation="20" result="blur2" />
              <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Inner Radial Light -->
          <path id="heart-inner" class="heart-inner-glow"
            d="M 300 165 C 285 110 210 65 140 85 C 55 110 35 210 90 310 C 145 405 240 470 300 515 C 360 470 455 405 510 310 C 565 210 545 110 460 85 C 390 65 315 110 300 165 Z" />

          <!-- Animated Heart Stroke Outline -->
          <path id="heart-path" class="heart-path-outline"
            d="M 300 165 C 285 110 210 65 140 85 C 55 110 35 210 90 310 C 145 405 240 470 300 515 C 360 470 455 405 510 310 C 565 210 545 110 460 85 C 390 65 315 110 300 165 Z" />
        </svg>

        <!-- ==========================================
             THE MAIN ATTRACTION: Fatemeh Calligraphy
             ========================================== -->
        <div class="name-fatemeh-wrapper">
          
          <!-- Animated Pen Tip Particle -->
          <div id="pen-tip" class="glowing-pen-tip"></div>

          <!-- Handwritten SVG Path Calligraphy Strokes -->
          <svg id="calligraphy-svg" class="calligraphy-svg" viewBox="0 0 500 160">
            <!-- Capital F Ornate Top Flown Stroke -->
            <path class="cursive-stroke" d="M 60 44 C 75 30, 115 32, 138 46" />
            <!-- Capital F Stem & Lower Swirl Loop -->
            <path class="cursive-stroke" d="M 94 38 C 96 65, 86 102, 78 128 C 72 140, 58 138, 54 128 C 50 116, 68 112, 86 114" />
            <!-- Capital F Crossbar -->
            <path class="cursive-stroke" d="M 72 82 C 86 80, 112 82, 126 84" />

            <!-- Main Connected Lowercase 'atemeh' Strokes -->
            <path id="name-main-path" class="cursive-stroke"
              d="M 128 106 C 146 90, 168 84, 162 104 C 158 116, 142 118, 140 106 C 138 94, 156 88, 172 94 C 182 82, 192 60, 196 55 C 196 68, 192 98, 192 112 C 192 118, 198 122, 206 116 C 214 110, 222 96, 216 92 C 210 88, 204 98, 212 112 C 220 120, 228 116, 235 102 C 240 92, 246 88, 252 114 C 255 100, 264 88, 272 114 C 275 100, 284 88, 292 112 C 296 118, 302 116, 308 105 C 314 96, 322 90, 316 88 C 308 86, 304 98, 312 112 C 318 118, 326 112, 332 98 C 338 78, 348 52, 352 50 C 352 64, 346 96, 344 114 C 348 98, 358 88, 368 96 C 374 102, 374 114, 386 116" />

            <!-- 't' Cross stroke -->
            <path class="cursive-stroke" d="M 184 76 C 195 76, 206 77, 215 78" />

            <!-- Underline Flourish -->
            <path class="cursive-stroke" d="M 68 145 C 160 156, 300 152, 395 138" />
          </svg>

          <!-- Luminous Calligraphy Text (English Handwritten Font) -->
          <h2 id="name-calligraphy-text" class="name-text-calligraphy">Fatemeh</h2>

          <!-- Delicate Decorative Heart & Flourish Underneath -->
          <div id="decorative-flourish" class="decorative-flourish">
            <span class="flourish-line"></span>
            <svg class="flourish-heart" viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span class="flourish-line"></span>
          </div>

        </div>

      </div>

      <!-- ==========================================
           STAGE 5: Final Persian Romantic Message
           ========================================== -->
      <footer id="final-message" class="final-message-container">
        <p class="final-romantic-quote">
          «فاطمه، این برنامه فقط یک خروجی داشت: لبخند تو. ♡»
        </p>

        <div class="final-actions">
          <button id="replay-btn" class="replay-btn">
            <svg class="replay-icon" viewBox="0 0 24 24">
              <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            <span>از اول اجرا کن</span>
          </button>
        </div>
      </footer>

    </main>

  </div>

  <!-- Main JavaScript File -->
  <script src="script.js"></script>

</body>
</html>
